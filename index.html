<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Lamp — Day 1 Proof of Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F0;
    --surface: #FFFFFF;
    --ink: #24211C;
    --muted: #726C60;
    --line: #E3DFD3;
    --lamp-glass: #D8D2C1;
    --lamp-on: #E39B2E;
    --lamp-glow: #FFD98A;
    --listen: #386580;
    --success: #4C7A57;
    --error: #A6402E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1815;
      --surface: #242119;
      --ink: #F1EEE6;
      --muted: #A79F8E;
      --line: #38332A;
      --lamp-glass: #4A4438;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1815;
    --surface: #242119;
    --ink: #F1EEE6;
    --muted: #A79F8E;
    --line: #38332A;
    --lamp-glass: #4A4438;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Sans 3', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom, 0px));
    min-height: 100%;
  }
  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }

  header { text-align: center; margin-bottom: 22px; }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { color: var(--muted); font-size: 0.95rem; margin: 0; line-height: 1.5; }

  .lang-toggle { display: flex; gap: 8px; width: 100%; margin-bottom: 16px; }
  .lang-btn {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    min-height: 44px;
    font-family: inherit;
  }
  .lang-btn.active { background: var(--listen); color: #fff; border-color: var(--listen); }
  .lang-btn:focus-visible { outline: 3px solid var(--listen); outline-offset: 2px; }

  .lamp-stage {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 20px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .devices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .device-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px 10px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-family: inherit;
    cursor: pointer;
    min-height: 92px;
  }
  .device-dot {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--lamp-glass);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .device-card.on .device-dot { background: var(--lamp-glow); box-shadow: 0 0 14px var(--lamp-on); }
  .device-name { font-size: 0.9rem; font-weight: 600; color: var(--ink); }
  .device-state { font-size: 0.78rem; color: var(--muted); }
  .device-card.on .device-state { color: var(--success); font-weight: 600; }

  .status {
    min-height: 1.6em;
    font-size: 1.05rem;
    font-weight: 600;
    text-align: center;
    color: var(--muted);
  }
  .status.listening { color: var(--listen); }
  .status.success { color: var(--success); }
  .status.error { color: var(--error); }

  .heard {
    font-size: 0.9rem;
    color: var(--muted);
    text-align: center;
    min-height: 1.4em;
  }
  .heard strong { color: var(--ink); font-weight: 600; }

  .mic-btn {
    margin-top: 4px;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: none;
    background: var(--listen);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  }
  .mic-btn:active { transform: scale(0.94); }
  .mic-btn.listening { background: var(--error); animation: pulse 1.3s infinite; }
  .mic-btn:focus-visible { outline: 3px solid var(--listen); outline-offset: 3px; }
  .mic-btn svg { width: 34px; height: 34px; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 6px 18px rgba(0,0,0,0.15), 0 0 0 0 rgba(166,64,46,0.35); }
    50% { box-shadow: 0 6px 18px rgba(0,0,0,0.15), 0 0 0 14px rgba(166,64,46,0); }
  }
  .mic-label { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

  .log {
    width: 100%;
    margin-top: 26px;
  }
  .log h2 {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .log ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .log li {
    font-size: 0.85rem;
    color: var(--muted);
    padding: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .log li time { color: var(--muted); opacity: 0.75; margin-right: 8px; }
  .log li b { color: var(--ink); }
  .log .empty { color: var(--muted); opacity: 0.7; font-style: italic; }

  .gesture-section { width: 100%; margin-top: 22px; }
  .gesture-section video {
    display: none;
    width: 100%;
    border-radius: 14px;
    margin-top: 10px;
    transform: scaleX(-1);
  }
  .gesture-status {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
    min-height: 1.3em;
  }

  .support-note {
    margin-top: 20px;
    font-size: 0.82rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Voice Home — Day 6</h1>
    <p>Say a device and an action — "fan on," "door open," "టీవీ ఆన్." Or use the camera below for gesture control.</p>
  </header>

  <div class="lang-toggle" role="group" aria-label="Choose recognition language">
    <button type="button" class="lang-btn active" id="langEn" data-lang="en-IN">English</button>
    <button type="button" class="lang-btn" id="langTe" data-lang="te-IN">తెలుగు</button>
  </div>

  <div class="lamp-stage">
    <div class="devices" id="devices"></div>

    <div class="status" id="status">Tap the mic and say a command</div>
    <div class="heard" id="heard"></div>

    <button class="mic-btn" id="micBtn" aria-label="Start listening for a voice command">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <div class="mic-label" id="micLabel">Tap to speak</div>

    <div class="gesture-section">
      <button type="button" class="lang-btn" id="camBtn" style="width:100%;">Start camera (gesture control — Lamp only for now)</button>
      <video id="cam" playsinline muted autoplay></video>
      <div class="gesture-status" id="gestureStatus"></div>
    </div>
  </div>

  <div class="log">
    <h2>Command log</h2>
    <ul id="logList">
      <li class="empty">Nothing heard yet</li>
    </ul>
  </div>

  <p class="support-note" id="supportNote"></p>

</div>

<script>
  const DEVICES = [
    { id: 'lamp', name: 'Lamp', onLabel: 'On', offLabel: 'Off', words: ['light', 'lamp', 'దీపం', 'లైట్'] },
    { id: 'fan', name: 'Fan', onLabel: 'On', offLabel: 'Off', words: ['fan', 'ఫ్యాన్'] },
    { id: 'tv', name: 'TV', onLabel: 'On', offLabel: 'Off', words: ['tv', 'television', 'టీవీ'] },
    { id: 'door', name: 'Door', onLabel: 'Open', offLabel: 'Closed', words: ['door', 'తలుపు'] }
  ];
  const deviceState = {};
  DEVICES.forEach(d => deviceState[d.id] = false);
  const devicesGrid = document.getElementById('devices');

  function renderDevices() {
    devicesGrid.innerHTML = '';
    DEVICES.forEach(d => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'device-card' + (deviceState[d.id] ? ' on' : '');
      const label = deviceState[d.id] ? d.onLabel : d.offLabel;
      card.setAttribute('aria-label', d.name + ' ' + label);
      card.innerHTML = '<span class="device-dot"></span><span class="device-name">' + d.name + '</span><span class="device-state">' + label + '</span>';
      card.addEventListener('click', () => setDevice(d.id, !deviceState[d.id], 'manual tap'));
      devicesGrid.appendChild(card);
    });
  }

  function setDevice(id, on, source) {
    deviceState[id] = on;
    renderDevices();
    const d = DEVICES.find(x => x.id === id);
    const msg = d.name + ' ' + (on ? d.onLabel : d.offLabel);
    setStatus(msg, 'success');
    speak(msg);
    addLog(msg + (source ? ' (' + source + ')' : ''));
  }

  renderDevices();

  const statusEl = document.getElementById('status');
  const heardEl = document.getElementById('heard');
  const micBtn = document.getElementById('micBtn');
  const micLabel = document.getElementById('micLabel');
  const logList = document.getElementById('logList');
  const supportNote = document.getElementById('supportNote');

  let logCount = 0;

  function speak(text) {
    try {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) { /* speech synthesis unavailable — visual feedback still works */ }
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function addLog(text, ok) {
    if (logCount === 0) logList.innerHTML = '';
    const li = document.createElement('li');
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    li.innerHTML = '<time>' + time + '</time><b>' + text + '</b>';
    logList.prepend(li);
    logCount++;
    while (logList.children.length > 6) logList.removeChild(logList.lastChild);
  }

  // --- Speech recognition setup ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    supportNote.textContent = 'This browser doesn\'t support voice recognition. On a phone, open this page in Chrome for Android for the voice feature.';
    micBtn.disabled = true;
    micBtn.style.opacity = '0.5';
    micLabel.textContent = 'Voice unavailable here';
  } else {
    supportNote.textContent = 'First time: your browser will ask for microphone permission — allow it to test voice control.';
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-IN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;
    let listening = false;
    let currentLang = 'en-IN';

    const langButtons = document.querySelectorAll('.lang-btn[data-lang]');
    langButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        langButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.getAttribute('data-lang');
        recognition.lang = currentLang;
        addLog('Language set to ' + btn.textContent);
      });
    });

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('listening');
      micLabel.textContent = 'Listening…';
      setStatus('Listening…', 'listening');
      heardEl.textContent = '';
    };

    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      micLabel.textContent = 'Tap to speak';
    };

    recognition.onerror = (e) => {
      listening = false;
      micBtn.classList.remove('listening');
      micLabel.textContent = 'Tap to speak';
      if (e.error === 'not-allowed' || e.error === 'permission-denied') {
        setStatus('Microphone permission denied', 'error');
        addLog('Mic permission denied — enable it in browser site settings');
      } else if (e.error === 'no-speech') {
        setStatus('Didn\'t catch that — try again', 'error');
      } else {
        setStatus('Voice error: ' + e.error, 'error');
        addLog('Recognition error: ' + e.error);
      }
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.trim().toLowerCase();
      heardEl.innerHTML = 'Heard: <strong>"' + transcript + '"</strong>';

      const onWords = ['on', 'ఆన్', 'వెలిగించు', 'వేసి', 'open', 'తెరువు'];
      const offWords = ['off', 'ఆఫ్', 'ఆర్పు', 'మూసి', 'ఆపేసి', 'ఆపు', 'close'];
      const helpWords = ['help', 'సహాయం'];

      const matchedDevice = DEVICES.find(d => d.words.some(w => transcript.includes(w))) || DEVICES[0];

      if (onWords.some(w => transcript.includes(w))) {
        setDevice(matchedDevice.id, true, 'voice');
      } else if (offWords.some(w => transcript.includes(w))) {
        setDevice(matchedDevice.id, false, 'voice');
      } else if (helpWords.some(w => transcript.includes(w))) {
        setStatus('Help command recognized (SOS action comes in Month 2)', 'success');
        addLog('Heard "help" — no action wired yet');
      } else {
        setStatus('Didn\'t recognize that command', 'error');
        addLog('Unrecognized: "' + transcript + '"');
      }
    };

    async function beginListening() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
        } catch (err) {
          setStatus('Microphone blocked: ' + (err.name || 'unknown'), 'error');
          addLog('getUserMedia failed — ' + err.name + (err.message ? ': ' + err.message : ''));
          return;
        }
      } else {
        addLog('navigator.mediaDevices unavailable — trying recognition directly');
      }
      try {
        recognition.start();
      } catch (e) {
        setStatus('Could not start listening: ' + (e.message || e.name || e), 'error');
        addLog('recognition.start() failed — ' + (e.message || e.name || e));
      }
    }

    micBtn.addEventListener('click', () => {
      if (listening) {
        recognition.stop();
      } else {
        beginListening();
      }
    });
  }
</script>

<script type="module">
  // Gesture control — proof of concept, Lamp only for now.
  // Uses MediaPipe's pretrained gesture recognizer (no training needed):
  // Open_Palm -> lamp on, Closed_Fist -> lamp off.
  const camBtn = document.getElementById('camBtn');
  const video = document.getElementById('cam');
  const gestureStatus = document.getElementById('gestureStatus');
  let recognizer = null;
  let running = false;
  let lastGesture = null;
  let lastActionTime = 0;

  camBtn.addEventListener('click', async () => {
    if (running) return;
    camBtn.disabled = true;
    camBtn.textContent = 'Loading gesture model…';
    try {
      const { GestureRecognizer, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
      const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      recognizer = await GestureRecognizer.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task'
        },
        runningMode: 'VIDEO'
      });
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      video.srcObject = stream;
      video.style.display = 'block';
      await video.play();
      running = true;
      camBtn.textContent = 'Camera active — show an open palm or a fist';
      requestAnimationFrame(detectLoop);
    } catch (err) {
      gestureStatus.textContent = 'Could not start: ' + (err.message || err.name || err);
      camBtn.disabled = false;
      camBtn.textContent = 'Start camera (gesture control — Lamp only for now)';
    }
  });

  function detectLoop() {
    if (!running) return;
    if (video.readyState >= 2) {
      const result = recognizer.recognizeForVideo(video, performance.now());
      if (result.gestures.length > 0) {
        const g = result.gestures[0][0];
        gestureStatus.textContent = 'Detected: ' + g.categoryName + ' (' + Math.round(g.score * 100) + '%)';
        if (g.score > 0.6) handleGesture(g.categoryName);
      } else {
        gestureStatus.textContent = 'No hand detected';
      }
    }
    requestAnimationFrame(detectLoop);
  }

  function handleGesture(name) {
    const now = Date.now();
    if (name === lastGesture && now - lastActionTime < 2000) return;
    if (name === 'Open_Palm') {
      setDevice('lamp', true, 'gesture');
      lastGesture = name; lastActionTime = now;
    } else if (name === 'Closed_Fist') {
      setDevice('lamp', false, 'gesture');
      lastGesture = name; lastActionTime = now;
    }
  }
</script>
</body>
</html>
